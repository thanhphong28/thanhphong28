<svg width="900" height="18" viewBox="0 0 900 18" fill="none" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="9" x2="900" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0" />
      <stop offset="20%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="1" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .traveler {
      animation: glide 4.5s ease-in-out infinite;
    }
    @keyframes glide {
      0% { transform: translateX(60px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(700px); opacity: 0; }
    }
  </style>
  <rect x="0" y="8.5" width="900" height="1" fill="url(#lineGrad)" />
  <rect class="traveler" x="0" y="7.5" width="140" height="3" rx="1.5" fill="url(#pulseGrad)" />
  <circle cx="450" cy="9" r="3" fill="#0D1117" stroke="#38BDF8" stroke-width="1.5" />
</svg>
