  <circle cx="37" cy="42" r="1.7" fill="#39D353" />
  <circle cx="43" cy="42" r="1.7" fill="#8B949E" />

  <!-- Category Pill with Live Dot -->
  <rect x="318" y="26" width="110" height="24" rx="12" fill="#13241A" stroke="#238636" stroke-width="1" />
  <circle cx="332" cy="38" r="3" fill="#39D353" />
  <text x="380" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#7EE787" letter-spacing="0.4">LIVE WEB APP</text>

  <!-- Title & Description -->
  <text x="22" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#F0F6FC" letter-spacing="-0.2">Couple Schedule</text>
  <text x="22" y="106" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="12.8" fill="#8B949E">Real-time synced master schedule web app engineered for</text>
  <text x="22" y="124" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="12.8" fill="#8B949E">native-like responsiveness, clean state &amp; instant sync.</text>

