      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="topSheen3" x1="0" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="448" height="174" rx="14" fill="#121418" stroke="#272B33" stroke-width="1.2" />
  <rect x="24" y="1.5" width="402" height="1" fill="url(#topSheen3)" />

  <!-- Minimalist macOS App Icon: Calendar Grid -->
  <rect x="22" y="20" width="38" height="38" rx="10" fill="url(#iconBg3)" stroke="#2F3541" stroke-width="1" />
  <rect x="31" y="30" width="20" height="18" rx="3" stroke="#E6EDF3" stroke-width="1.4" />
