  <text x="38" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">React 19  ·  Vite  ·  Supabase</text>
  <text x="428" y="162" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#39D353">Live Demo →</text>
