<svg width="900" height="236" viewBox="0 0 900 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nguyễn Thanh Phong — Breeze Boy, Frontend Software Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0F1E" />
      <stop offset="55%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="accentBar" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="65%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="scanBeam" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0" y1="0" x2="120" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.28" />
    </linearGradient>

    <linearGradient id="badgeStroke" x1="0" y1="0" x2="120" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.7" />
    </linearGradient>

    <radialGradient id="orbCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 40) rotate(130) scale(260 170)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 220) rotate(-20) scale(280 150)">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.38" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="234" rx="14" />
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #F8FAFC;
      letter-spacing: -0.8px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94A3B8;
    }
    .subtitle-strong {
      fill: #E2E8F0;
      font-weight: 600;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.7px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #CBD5E1;
    }
    .pill-accent {
      fill: #38BDF8;
    }
    .pulse-dot {
      animation: pulse 2.2s ease-in-out infinite;
      transform-origin: 44px 38px;
    }
    .pulse-ring {
      animation: ring 2.2s ease-out infinite;
      transform-origin: 44px 38px;
    }
    .scan-line {
      animation: scan 5.5s ease-in-out infinite;
    }
    .float-slow {
      animation: floatY 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @keyframes ring {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes scan {
      0% { transform: translateX(-260px); }
      100% { transform: translateX(920px); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
  </style>

  <!-- Card Background & Clipping -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="900" height="236" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="900" height="236" fill="url(#dotGrid)" />
    <rect x="0" y="0" width="900" height="236" fill="url(#orbCyan)" />
    <rect x="0" y="0" width="900" height="236" fill="url(#orbViolet)" />

    <!-- Subtle Geometric Orbit Accent on Right -->
    <g class="float-slow" opacity="0.45">
      <circle cx="804" cy="118" r="88" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 6" />
      <circle cx="804" cy="118" r="56" stroke="#818CF8" stroke-opacity="0.28" stroke-width="1" />
      <circle cx="804" cy="118" r="24" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.2" />
      <path d="M795 113 L788 118 L795 123 M813 113 L820 118 L813 123 M807 110 L801 126" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Top Glow Accent Line + Animated Scan Beam -->
    <rect x="0" y="0" width="900" height="2.5" fill="url(#accentBar)" />
    <rect class="scan-line" x="0" y="0" width="260" height="2.5" fill="url(#scanBeam)" />

    <!-- Top Status Row -->
    <rect x="28" y="24" width="332" height="28" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1" />
    <circle class="pulse-ring" cx="44" cy="38" r="4" fill="#10B981" />
    <circle class="pulse-dot" cx="44" cy="38" r="3.8" fill="#10B981" />
    <text x="58" y="42" class="mono" fill="#94A3B8">OPEN TO COLLABORATE · HCMC, VIETNAM</text>

    <rect x="738" y="24" width="134" height="28" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1" />
    <text x="805" y="42" text-anchor="middle" class="mono" fill="#38BDF8">BREEZE.DEV // 26</text>

    <!-- Main Identity -->
    <text x="30" y="108" class="title">Nguyễn Thanh Phong</text>

    <!-- Alias Pill -->
    <rect x="436" y="79" width="124" height="30" rx="8" fill="url(#badgeGrad)" stroke="url(#badgeStroke)" stroke-width="1.1" />
    <text x="498" y="99" text-anchor="middle" class="mono" fill="#7DD3FC">BREEZE BOY</text>

    <!-- Role Subtitle -->
    <text x="30" y="139" class="subtitle">
      <tspan class="subtitle-strong">Frontend Software Engineer</tspan>
      <tspan> @ 315 Medical  ·  </tspan>
      <tspan class="subtitle-strong">Full-Stack &amp; Android Builder</tspan>
    </text>

    <!-- Bottom Telemetry Pills -->
    <!-- Pill 1 -->
    <rect x="28" y="168" width="250" height="38" rx="10" fill="#111827" fill-opacity="0.88" stroke="#1E293B" stroke-width="1" />
    <circle cx="46" cy="187" r="3.5" fill="#38BDF8" />
    <text x="58" y="191.5" class="pill-text"><tspan class="pill-accent">EMR</tspan> Platform · ~200 Clinics</text>

    <!-- Pill 2 -->
    <rect x="290" y="168" width="244" height="38" rx="10" fill="#111827" fill-opacity="0.88" stroke="#1E293B" stroke-width="1" />
    <circle cx="308" cy="187" r="3.5" fill="#818CF8" />
    <text x="320" y="191.5" class="pill-text"><tspan fill="#A5B4FC">SGU</tspan> · Software Engineering</text>

    <!-- Pill 3 -->
    <rect x="546" y="168" width="326" height="38" rx="10" fill="#111827" fill-opacity="0.88" stroke="#1E293B" stroke-width="1" />
    <circle cx="564" cy="187" r="3.5" fill="#34D399" />
    <text x="576" y="191.5" class="pill-text"><tspan fill="#6EE7B7">Creator</tspan> · BreezeOS · BreezeIsland · Board</text>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="898" height="234" rx="14" stroke="#1E293B" stroke-width="1.5" />
</svg>
